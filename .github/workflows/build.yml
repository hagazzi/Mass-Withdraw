name: PR Build

on:
  push:
  workflow_dispatch: 
    inputs:
      tag:
        description: "MR v1.0.2.0"
        required: true

jobs:

  build:
    runs-on: windows-latest

    env:
      Solution_Name: MassWithdraw

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud Latest
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore NuGet Packages
      run: dotnet restore MassWithdraw/MassWithdraw.csproj        

    - name: Build with dotnet
      run: dotnet build --no-restore -c Release MassWithdraw/MassWithdraw.csproj

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        path: .\MassWithdraw\bin\x64\Release\MassWithdraw\*
        draft: true      


