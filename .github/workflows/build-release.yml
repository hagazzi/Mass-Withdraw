name: Release Build

on:
  push:
  workflow_dispatch: 

jobs:

  build:
    runs-on: windows-latest

    env:
      Solution_Name: MassWithdraw
  
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud Latest
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore NuGet Packages
      run: dotnet restore MassWithdraw/MassWithdraw.csproj        

    - name: Build with dotnet
      run: dotnet build --no-restore -c Release MassWithdraw/MassWithdraw.csproj

    - name: Set Release Tag
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT      

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: run-${{ steps.vars.outputs.sha_short }}
        name: Release ${{ steps.vars.outputs.sha_short }}
        body: |
          Automated release generated from commit ${{ github.sha }}.
          Review changes in the repository history.
          I have no idea what i'm doing!
        draft: false
        prerelease: false          
        files: |
          MassWithdraw/bin/Release/MassWithdraw/latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


